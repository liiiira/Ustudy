services:
  postgres:
    image: postgres:18
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - ./pgdata:/var/lib/postgresql
  redis:
    image: redis:8
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./redisdata:/data
